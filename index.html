<meta charset="utf-8">

<title>Fox Protege • Portaria</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef1f5;color:#111827}
header{background:linear-gradient(135deg,#0b1220,#1f2937);color:white;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 14px #0003;position:sticky;top:0;z-index:5}
.brand-mark{width:58px;height:58px;border-radius:12px;background:#000;display:grid;place-items:center;overflow:hidden;box-shadow:0 2px 8px #0003;border:1px solid #d7b44a}
.brand-mark img{width:100%;height:100%;object-fit:cover;object-position:center}
header h1{letter-spacing:1.5px;font-weight:900}
h1{font-size:20px;margin:0}.sub{opacity:.75;font-size:11px;letter-spacing:.7px}
main{max-width:700px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input,textarea,button,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{border:0;background:#111827;color:white;font-weight:700;cursor:pointer;margin-top:10px}
button.secondary{background:#e5e7eb;color:#111827}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:9px 0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#fef3c7;font-size:12px}.delivered{background:#dcfce7}
#signature{border:2px dashed #9ca3af;width:100%;height:220px;border-radius:12px;touch-action:none;background:#fff}
.small{font-size:12px;color:#6b7280}.hidden{display:none}.empty{text-align:center;color:#6b7280;padding:20px}
</style>
</head>

  <div><h1>GRUPO FOX PROTEGE</h1><div class="sub">SISTEMA DE RECEBIMENTO • PORTARIA</div></div>
</header>
<main>
<section class="card">
<h2>📦 Nova encomenda</h2>
<div class="small" style="margin-top:-8px">Registre a chegada e mantenha o histórico organizado.</div>
<div class="grid">
<div><label>Bloco</label><input id="bloco" placeholder="Ex.: A"></div>
<div><label>Apartamento</label><input id="apto" placeholder="Ex.: 102"></div>
</div>
<label>Nome do morador</label><input id="morador" placeholder="Nome completo">
<label>Transportadora</label><input id="transportadora" placeholder="Ex.: Correios">
<label>Código / rastreio</label><input id="codigo" placeholder="Opcional">
<label>Observação</label><textarea id="obs" rows="2" placeholder="Ex.: caixa grande"></textarea>
<button onclick="salvar()">Registrar encomenda</button>
</section>

<section class="card">
<h2>📊 Resumo</h2>
<div class="grid">
  <div class="item"><b id="totalCount">0</b><div class="small">Total</div></div>
  <div class="item"><b id="pendingCount">0</b><div class="small">Aguardando retirada</div></div>
</div>
</section>
<section class="card">
<h2>📋 Encomendas</h2>
<input id="busca" oninput="render()" placeholder="Pesquisar bloco, apartamento ou morador">
<div id="lista"></div>
</section>

<section id="entrega" class="card hidden">
<h2>✍️ Assinatura do morador</h2>
<div id="dadosEntrega" class="small"></div>
<canvas id="signature"></canvas>
<button onclick="limparAssinatura()" class="secondary">Limpar assinatura</button>
<button onclick="confirmarEntrega()">Confirmar entrega</button>
</section>
</main>

<script>
const KEY="fox_protege_encomendas";
let encomendas=JSON.parse(localStorage.getItem(KEY)||"[]"), selecionada=null;
const $=id=>document.getElementById(id);
function salvar(){
 const e={id:Date.now(),bloco:$("bloco").value.trim(),apto:$("apto").value.trim(),morador:$("morador").value.trim(),
 transportadora:$("transportadora").value.trim(),codigo:$("codigo").value.trim(),obs:$("obs").value.trim(),
 recebido:new Date().toLocaleString("pt-BR"),status:"Pendente",assinatura:null};
 if(!e.bloco||!e.apto||!e.morador){alert("Preencha bloco, apartamento e nome do morador.");return}
 encomendas.unshift(e);persist();["bloco","apto","morador","transportadora","codigo","obs"].forEach(x=>$(x).value="");render();
 alert("Encomenda registrada!");
}
function persist(){localStorage.setItem(KEY,JSON.stringify(encomendas))}
function render(){
 const q=$("busca").value.toLowerCase();
 $("totalCount").textContent=encomendas.length;
 $("pendingCount").textContent=encomendas.filter(e=>e.status==="Pendente").length;
 const arr=encomendas.filter(e=>(e.bloco+" "+e.apto+" "+e.morador+" "+e.codigo).toLowerCase().includes(q));
 $("lista").innerHTML=arr.length?arr.map(e=>`<div class="item">
 <b>Bloco ${esc(e.bloco)} • Apto ${esc(e.apto)}</b><br>${esc(e.morador)}
 <div class="small">${esc(e.transportadora||"Sem transportadora")} • ${e.recebido}</div>
 <span class="badge ${e.status==="Entregue"?"delivered":""}">${e.status}</span>
 ${e.status==="Pendente"?`<button onclick="abrirEntrega(${e.id})">✍️ Registrar retirada</button>`:""}
 </div>`).join(""):'<div class="empty">Nenhuma encomenda encontrada.</div>';
}
function abrirEntrega(id){selecionada=encomendas.find(e=>e.id===id);$("dadosEntrega").textContent=`${selecionada.morador} — Bloco ${selecionada.bloco}, Apto ${selecionada.apto}`;$("entrega").classList.remove("hidden");window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});prepararCanvas()}
function prepararCanvas(){const c=$("signature"),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);x.lineWidth=2;x.lineCap="round";let draw=false;
function pos(ev){const p=ev.touches?ev.touches[0]:ev;return{x:p.clientX-r.left,y:p.clientY-r.top}}
c.onpointerdown=e=>{draw=true;let p=pos(e);x.beginPath();x.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!draw)return;let p=pos(e);x.lineTo(p.x,p.y);x.stroke()};c.onpointerup=()=>draw=false;c.onpointerleave=()=>draw=false}
function limparAssinatura(){prepararCanvas()}
function confirmarEntrega(){if(!selecionada)return;const c=$("signature");selecionada.status="Entregue";selecionada.entregue=new Date().toLocaleString("pt-BR");selecionada.assinatura=c.toDataURL("image/png");persist();selecionada=null;$("entrega").classList.add("hidden");render();alert("Entrega registrada com assinatura.");}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();

</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
  <script>
const USUARIOS_FOX = [
  {
    usuario: "admin",
    senha: "1234",
    nome: "Administrador",
    tipo: "admin"
  }
];
function entrarSistema() {
  alert("A função de login foi chamada!");

  const usuario = document.getElementById("loginUsuario").value.trim();
  const senha = document.getElementById("loginSenha").value;
  const erro = document.getElementById("loginErro");

  erro.textContent = "";

  const usuariosCadastrados = JSON.parse(
    localStorage.getItem("foxUsuarios") || "[]"
  );

  const todosUsuarios = [
    ...USUARIOS_FOX,
    ...usuariosCadastrados
  ];

  const usuarioEncontrado = todosUsuarios.find(
    u => u.usuario === usuario && u.senha === senha
  );

  if (!usuarioEncontrado) {
    erro.textContent = "Usuário ou senha incorretos.";
    return;
  }

  localStorage.setItem(
    "foxUsuarioLogado",
    JSON.stringify(usuarioEncontrado)
  );

  alert("Login realizado com sucesso!");

mostrarPainelAdministrador();

  const login = document.getElementById("loginScreen");
  if (login) {
    login.style.display = "none";
  }

  const app = document.getElementById("app");
  if (app) {
    app.style.display = "block";
  }
}
function mostrarPainelAdministrador() {
  if (document.getElementById("painelUsuario")) return;

  const logado = localStorage.getItem("foxUsuarioLogado");
  if (!logado) return;

  const usuario = JSON.parse(logado);

  const painel = document.createElement("div");
  painel.id = "painelUsuario";
  painel.style = `
    background:#f3f4f6;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
  `;

  painel.innerHTML = `
    <b>${usuario.tipo === "admin" ? "👑 Administrador" : "👤 Usuário"}</b>

    ${usuario.tipo === "admin" ? `
      <button onclick="cadastrarUsuario()"
        style="display:block;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#111827;color:white;">
        + Cadastrar usuário
      </button>
    ` : ""}

    <button onclick="sairSistema()"
      style="display:block;margin-top:8px;padding:10px;border:0;border-radius:8px;background:#dc2626;color:white;">
      🚪 Sair
    </button>
  `;

  document.body.prepend(painel);
}

function cadastrarUsuario() {
  const usuario = prompt("Digite o novo usuário:");
  if (!usuario) return;

  const senha = prompt("Digite a senha:");
  if (!senha) return;

  let usuarios = JSON.parse(
    localStorage.getItem("foxUsuarios") || "[]"
  );

  if (usuarios.some(u => u.usuario === usuario)) {
    alert("Esse usuário já existe.");
    return;
  }

  usuarios.push({
    usuario: usuario,
    senha: senha,
    nome: usuario,
    tipo: "usuario"
  });

  localStorage.setItem(
    "foxUsuarios",
    JSON.stringify(usuarios)
  );

  alert("Usuário cadastrado com sucesso!");
}


 function sairSistema() {
  localStorage.removeItem("foxUsuarioLogado");

  const painel = document.getElementById("painelAdmin");
  if (painel) painel.remove();

  const login = document.getElementById("loginScreen");
  if (login) {
    login.style.display = "flex";
    document.getElementById("loginUsuario").value = "";
    document.getElementById("loginSenha").value = "";
    document.getElementById("loginErro").textContent = "";
  }
}
